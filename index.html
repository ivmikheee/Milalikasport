<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<script>window.TR_STANDALONE=true;</script>
</head>
<body>
<title>Мои тренировки</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="theme-color" content="#FFF0F6">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style id="css">/* Layout: one phone column — week tabs, day cards with an animated bunny, full-screen exercise sheet, bottom tab bar. Pink world in both themes. */
:root{
  --bg:#FFF0F6; --surface:#FFFFFF; --tile:#FFDDEB; --ink:#3D1430; --muted:#8C5878; --line:#F6CDE0;
  --accent:#E8337E; --accent-ink:#FFFFFF; --accent-soft:#FFD6E7; --berry:#A3215F; --berry-soft:#F8D3E6;
  --coach:#C2185B; --hl:#FF9A1F; --floor:#F2B6CF;
  --fur:#FFFFFF; --fur2:#F5DCE8; --ol:#4A1838; --top:#FF6FA8; --leg:#B5246A; --leg2:#8E1D55;
  --snk:#FFFFFF; --earin:#FFB0CD; --nose:#FF4F8B; --cheek:#FF9DC2;
  --eq:#EDB9D0; --eq2:#D28DAE; --metal:#4A1838; --plate-in:#FFF6FA; --cable:#9E3C74; --band:#C93CFF; --roller:#F27BB0; --ball:#FFD166;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F0A17; --surface:#2D1123; --tile:#3D1830; --ink:#FFE4F0; --muted:#D29BBB; --line:#4D2240;
  --accent:#FF5C9E; --accent-ink:#2A0718; --accent-soft:#4E1A37; --berry:#FF9CCB; --berry-soft:#45182F;
  --coach:#FF4D93; --hl:#FFB547; --floor:#5C2A4B;
  --fur:#FFF6FA; --fur2:#E9C9D9; --ol:#1C0612; --top:#FF6FA8; --leg:#C92B78; --leg2:#97205C;
  --snk:#FFF6FA; --earin:#FFB0CD; --nose:#FF4F8B; --cheek:#FF9DC2;
  --eq:#6A3657; --eq2:#8C4C72; --metal:#FFD3E6; --plate-in:#3D1830; --cable:#F28DC0; --band:#D77BFF; --roller:#F27BB0; --ball:#FFD166;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F0A17; --surface:#2D1123; --tile:#3D1830; --ink:#FFE4F0; --muted:#D29BBB; --line:#4D2240;
  --accent:#FF5C9E; --accent-ink:#2A0718; --accent-soft:#4E1A37; --berry:#FF9CCB; --berry-soft:#45182F;
  --coach:#FF4D93; --hl:#FFB547; --floor:#5C2A4B;
  --fur:#FFF6FA; --fur2:#E9C9D9; --ol:#1C0612; --top:#FF6FA8; --leg:#C92B78; --leg2:#97205C;
  --snk:#FFF6FA; --earin:#FFB0CD; --nose:#FF4F8B; --cheek:#FF9DC2;
  --eq:#6A3657; --eq2:#8C4C72; --metal:#FFD3E6; --plate-in:#3D1830; --cable:#F28DC0; --band:#D77BFF; --roller:#F27BB0; --ball:#FFD166;
  color-scheme:dark}

/* figure */
.fig line,.fig polyline{stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .floor{stroke:var(--floor);stroke-width:2}
.fig .o{stroke:var(--ol)}.fig .fur{stroke:var(--fur)}.fig .fur2{stroke:var(--fur2)}
.fig .top{stroke:var(--top)}.fig .leg{stroke:var(--leg)}.fig .leg2{stroke:var(--leg2)}
.fig .snk{stroke:var(--snk)}.fig .snk2{stroke:var(--fur2)}.fig .ein{stroke:var(--earin)}
.fig .head{fill:var(--fur);stroke:var(--ol);stroke-width:1.7}
.fig .hand{fill:var(--fur);stroke:var(--ol);stroke-width:1.4}.fig .hand2{fill:var(--fur2);stroke:var(--ol);stroke-width:1.4}
.fig .tail{fill:var(--fur);stroke:var(--ol);stroke-width:1.4}
.fig .eye{fill:var(--ol)}.fig .nose{fill:var(--nose)}.fig .cheek{fill:var(--cheek);opacity:.7}.fig .bow{fill:var(--top);stroke:var(--ol);stroke-width:1.1}
.fig line.zn{stroke:var(--hl)}.fig circle.zn{fill:var(--hl)}
.fig .eq{fill:var(--eq)}.fig .eq2{fill:var(--eq2)}.fig .eqs{stroke:var(--eq)}.fig .eqd{stroke:var(--eq2)}
.fig circle.eq{fill:var(--eq)}.fig circle.eq2{fill:var(--eq2)}
.fig .plate{fill:var(--plate-in);stroke:var(--metal);stroke-width:3}.fig .hub{fill:var(--metal)}
.fig .pad{fill:var(--eq2);stroke:var(--ol);stroke-width:1}
.fig .db{fill:var(--metal)}.fig .kbh{fill:none;stroke:var(--metal);stroke-width:2.4}
.fig .cable{stroke:var(--cable);stroke-width:1.6;stroke-dasharray:3 3}
.fig .band{stroke:var(--band);opacity:.9}.fig .ring{fill:none;stroke:var(--band);stroke-width:3}
.fig .trx{stroke:var(--metal)}.fig .trxh{fill:var(--band);stroke:var(--metal);stroke-width:1.2}
.fig .lever{stroke:var(--eq2)}.fig .platl{stroke:var(--eq2)}.fig .padl{stroke:var(--eq2)}
.fig .roller{fill:var(--roller);stroke:var(--ol);stroke-width:1.5}.fig .ball{fill:var(--ball);stroke:var(--ol);stroke-width:1.4}
.fig .hip{fill:var(--leg)}

*,*::before,*::after{box-sizing:border-box}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1.1;letter-spacing:-.01em;color:var(--ink)}
.top h1 em{font-style:normal;color:var(--accent)}
.coachbtn{font-size:13px;font-weight:800;padding:9px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.coachbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 0 16px;padding:12px 14px;border-radius:18px;background:var(--coach);color:#fff}
.coachbar b{font-family:var(--f-display);font-weight:700;font-size:15px}
.coachbar span{font-size:12.5px;opacity:.9;display:block}
.coachbar button{background:#fff;color:var(--coach);font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 4px 10px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);position:relative}
.day b{font-family:var(--f-display);font-weight:700;font-size:18px}
.day span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.sel span{color:var(--accent-ink);opacity:.85}
.day .today{position:absolute;top:7px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--berry)}
.day.sel .today{background:var(--accent-ink)}
.dayhead{display:flex;flex-direction:column;gap:3px;margin-bottom:14px}
.dayhead h2{font-family:var(--f-display);font-weight:500;font-size:21px;line-height:1.2}
.dayhead .meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.note{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:14px;background:var(--berry-soft);color:var(--ink);margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);text-align:left;width:100%;cursor:pointer}
.thumb{border-radius:16px;background:var(--tile);overflow:hidden}
.card .thumb{width:88px;height:77px}
.thumb svg{width:100%;height:100%;display:block}
.card .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font-weight:800;font-size:15px;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sr{font-family:var(--f-display);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums;color:var(--berry)}
.chip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--tile);color:var(--berry);white-space:nowrap}
.chip.acc{background:var(--accent);color:var(--accent-ink)}
.chip.ext{background:var(--berry-soft);color:var(--berry)}
.chk{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.chk svg{width:17px;height:17px;opacity:0}
.chk.done{background:var(--accent);border-color:var(--accent)}
.chk.done svg{opacity:1}
.card.isdone{opacity:.72}
.card.isdone .nm{text-decoration:line-through;text-decoration-color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:22px}
.howto{margin-top:22px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);padding:4px 14px}
.howto summary{cursor:pointer;font-weight:800;padding:10px 0;color:var(--berry);list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:" ›";font-weight:800}
.howto ol{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
/* library */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px 40px 12px 42px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--tile);color:var(--berry);font-weight:800}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{font-size:13px;font-weight:800;padding:8px 13px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);white-space:nowrap;color:var(--berry)}
.filters button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{font-size:13px;color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:8px 8px 12px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);text-align:left;min-width:0}
.tile .thumb{aspect-ratio:200/176;max-width:100%}
.tile .nm{font-size:14px;padding:0 4px}
.tile .chip{align-self:flex-start;margin-left:4px}
.sect{font-family:var(--f-display);font-weight:500;font-size:15px;margin:18px 0 10px;color:var(--berry)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .wrap{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:8px 0;margin-bottom:6px;color:var(--berry)}
.stage{border-radius:28px;background:var(--tile);position:relative;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;max-width:100%}
.ctrls{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.ctrls button{font-size:12px;font-weight:800;padding:7px 11px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);color:var(--berry)}
.ctrls button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{position:absolute;left:12px;top:10px;font-size:11px;font-weight:800;color:var(--berry);display:flex;align-items:center;gap:6px;background:var(--surface);padding:4px 9px;border-radius:999px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--hl)}
.xhead{display:flex;flex-direction:column;gap:4px;margin:18px 0 12px}
.xhead h2{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.18}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px;margin:0 0 14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:700}
.todaybox{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:6px}
.addto{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 14px;border-radius:18px;background:var(--berry-soft);margin-bottom:6px}
.addto span{font-size:13px;font-weight:800;color:var(--berry);margin-right:4px}
.addto button{font-weight:800;font-size:13px;padding:7px 12px;border-radius:999px;background:var(--surface);color:var(--berry);border:1.5px solid var(--line)}
.addto button.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.accs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.accs button{font-size:13px;font-weight:800;padding:9px 13px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);color:var(--berry)}
.accs button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sec{margin-top:22px}
.sec h3{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s;max-width:62ch}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;font-size:13px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.angles{display:flex;flex-direction:column;gap:8px}
.angles div{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.angles b{font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.bul li{position:relative;padding-left:20px;max-width:62ch}
.bul li::before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.bul.bad li::before{background:none;border:2px solid var(--muted);width:6px;height:6px}
.accbox{padding:12px 14px;border-radius:18px;background:var(--accent-soft)}
.hint{font-size:13.5px;color:var(--muted);margin:0}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size:11.5px;font-weight:800;color:var(--muted)}
.nav button.sel{color:var(--accent)}
.nav svg{width:22px;height:22px}
/* editor */
.cardwrap{display:flex;flex-direction:column}
.cardwrap .card{position:relative;z-index:1}
body.coach .card{border-color:var(--accent)}
.ed{display:flex;flex-direction:column;gap:8px;padding:22px 12px 12px;border-radius:0 0 20px 20px;background:var(--accent-soft);margin:-14px 0 0;border:1.5px solid var(--accent);border-top:0}
.ed .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed label{font-size:12px;font-weight:800;color:var(--berry)}
.ed input,.ed select,.titlein{font:inherit;font-size:16px;padding:7px 9px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;box-sizing:border-box}
.ed input.n{width:58px} .ed input.t{width:110px} .ed input.w{flex:1;min-width:140px} .ed select{max-width:100%}
.ed .ib{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;color:var(--berry)}
.ed .ib.del{color:var(--coach)}
.titlein{width:100%;font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.add{width:100%;padding:14px;border-radius:20px;border:2px dashed var(--accent);color:var(--accent);font-weight:800;margin-top:10px;background:var(--surface)}
.savebar{position:fixed;left:0;right:0;z-index:25;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .in{max-width:560px;margin:0 auto 8px;display:flex;gap:10px;align-items:center;padding:10px 10px 10px 16px;border-radius:20px;background:var(--coach);color:#fff;box-shadow:0 8px 24px rgba(120,10,60,.25)}
.savebar .t{flex:1;font-size:13px;font-weight:700;min-width:0}
.savebar button{background:#fff;color:var(--coach);font-weight:800;padding:10px 16px;border-radius:14px;white-space:nowrap}
.savebar button[disabled]{opacity:.55}
.pickhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;padding:12px 14px;border-radius:18px;background:var(--coach);color:#fff;font-weight:800}
.pickhead button{color:var(--coach);background:#fff;padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}

/* weights & progress */
.nav button{font-size:11px}
.chip.wt{background:var(--berry-soft);color:var(--berry)}
.logsec h3{margin-bottom:10px}
.logsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.logsum div{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.logsum b{font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.logsum span{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.logsum .up b,.trend.up{color:var(--accent)}
.logsum .dn b,.trend.dn{color:var(--berry)}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;margin-bottom:8px}
.chart text{font:700 9.5px var(--f-body);fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ar,.spark .ar{fill:var(--accent-soft);opacity:.7}
.chart .ln,.spark .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark .ln{stroke-width:2}
.chart .dt,.spark .dt{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .dt.last,.spark .dt.last{fill:var(--accent)}
.trend{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 12px}
.logform{display:flex;align-items:flex-end;gap:8px;margin:6px 0 4px}
.logform label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:0}
.logform label:first-child{flex:1.2}.logform label:nth-child(2){flex:1}
.logform input{font:600 17px var(--f-body);width:100%;min-width:0;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.logform input:focus{outline:2px solid var(--accent);outline-offset:1px}
.logform button{flex:1.4;font-weight:800;font-size:13.5px;line-height:1.2;padding:12px 10px;border-radius:14px;background:var(--accent);color:var(--accent-ink);min-height:48px}
.loghist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.loghist li{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.loghist li span{flex:1;color:var(--muted);font-weight:600}
.loghist li b{font-variant-numeric:tabular-nums;color:var(--ink)}
.loghist li button{width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:13px}
.progsum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.progsum span{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--tile);color:var(--berry)}
.progsum b{font-family:var(--f-display);font-weight:500;margin-right:3px}
.progsum .up{background:var(--accent);color:var(--accent-ink)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);width:100%}
.prow .pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prow .nm{font-weight:800;font-size:14.5px;color:var(--ink)}
.prow .spark{width:92px;height:32px;flex:none}
.chip.dl{background:var(--tile);color:var(--berry)}
.chip.dl.up{background:var(--accent);color:var(--accent-ink)}
.progact{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.progact button{font-weight:800;font-size:14px;padding:13px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--berry);min-height:48px}
.progact .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.progact div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.progact button:disabled{opacity:.45}
.goal{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.goal .gt{font-size:12.5px;font-weight:800;color:var(--berry);font-variant-numeric:tabular-nums}
.gb{display:block;height:6px;border-radius:999px;background:var(--tile);overflow:hidden}
.gb b{display:block;height:100%;border-radius:999px;background:var(--accent)}
.goalbox{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:8px}
.goalbox div{display:flex;flex-direction:column;gap:2px}
.goalbox span{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.goalbox b{font-family:var(--f-display);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.goalbox .arr{color:var(--accent);font-weight:800;font-size:18px}
.goalbox .gp{margin-left:auto;text-align:right}
.goalbox .gp b{color:var(--accent)}
.goalbox+.gb{margin:-2px 0 12px}
.ed input.n{width:72px}
.prow .pm .gb{margin-top:3px}
.logbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.logbtns button{font-weight:800;font-size:14px;padding:12px 8px;border-radius:14px;min-height:48px;line-height:1.2}
.logbtns .o{background:var(--surface);color:var(--berry);border:1.5px solid var(--accent)}
.logbtns .p{grid-column:1/-1;background:var(--accent);color:var(--accent-ink)}
.lbox{padding:12px 14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:8px}
.lbox.rec{border-color:var(--accent)}
.lbox .lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.lbox .lh b{font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--ink)}
.lbox .lh span{font-size:12px;font-weight:700;color:var(--muted)}
.lbox.rec .lh span{color:var(--berry)}
.lbox .logform{margin:0 0 8px}
.lbtn{width:100%;font-weight:800;font-size:14px;padding:12px;border-radius:14px;background:var(--accent);color:var(--accent-ink);min-height:48px}
.lbtn.alt{background:var(--tile);color:var(--berry)}
.mid{margin:4px 0 6px;padding:2px 14px 12px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line)}
.mid summary{cursor:pointer;font-weight:800;font-size:13.5px;color:var(--berry);padding:12px 0;list-style:none}
.mid summary::-webkit-details-marker{display:none}
.mid summary::after{content:" ›"}
.mid .logform{margin:0 0 8px}
.mid:not([open]){padding-bottom:0}

/* ---------- saving ---------- */
function buildDoc(){var reset='';document.querySelectorAll('head style').forEach(function(s){if(!reset&&/safe-area-inset/.test(s.textContent))reset=s.textContent});
 if(!reset)reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
 var css=document.getElementById('css').textContent,js=document.getElementById('appjs').textContent,json=JSON.stringify(PLAN).replace(/</g,'\\u003c');
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+PRELUDE+'<style id="css">'+css+'</style>\n<script type="application/json" id="plan">'+json+'<\/script>\n<div id="app"></div>\n<script id="appjs">'+js+'<\/script></body></html>'}
function save(){if(S.saving)return;
 PLAN.days.forEach(function(d){d.items.forEach(function(it){it.sets=Math.max(1,parseInt(it.sets,10)||1)})});
 var was=PLAN.example;PLAN.example=false;
 if(MODE==='local'){try{localStorage.setItem('tr.plan',JSON.stringify(PLAN));S.dirty=false;S.msg='Сохранено на этом телефоне'}catch(e){PLAN.example=was;S.msg='Не получилось сохранить: браузер не даёт хранить данные'}render(true);return}
 if(!ART){PLAN.example=was;S.msg='Сохранение недоступно в этом просмотре';render(true);return}
 S.saving=true;S.msg='Сохраняю…';render(true);
 try{sessionStorage.setItem('tr.ui',JSON.stringify({day:S.day,edit:true,msg:'Сохранено — она увидит это при открытии'}))}catch(e){}
 ART.publish(buildDoc()).then(function(){S.saving=false;S.dirty=false;S.msg='Сохранено — она увидит это при открытии';render(true)},function(err){
  S.saving=false;PLAN.example=was;var c=err&&err.code;try{sessionStorage.removeItem('tr.ui')}catch(e){}
  if(c==='conflict')S.msg='Страницу только что обновили в другом окне — она перезагрузится';
  else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared'){S.msg='';S.canEdit=false;S.edit=false;toast('Здесь только просмотр')}
  else if(c==='rate_limited')S.msg='Слишком часто. Подожди минуту и сохрани ещё раз';
  else S.msg='Не получилось сохранить. Попробуй ещё раз';
  render(true)})}

render();
if(MODE==='claude'){Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){ART=r[0];var u=r[1];
  if(!ART||!u){S.canEdit=false;S.edit=false;render(true);return}
  return u.canEdit().then(function(ok){S.canEdit=!!ok;if(!S.canEdit)S.edit=false;render(true)})}).catch(function(){})}

})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
